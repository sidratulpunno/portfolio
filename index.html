<!DOCTYPE html>
<html>
<head>
  <base href="/portfolio/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Portfolio of Sheikh Sidratul Muntaha Punno — HPC & AI Engineer">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sheikh Sidratul Muntaha Punno</title>
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; padding: 0; background: #0A0A0A; }
    #loading {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; align-items: center; justify-content: center;
      background: #0A0A0A;
    }
    #loading span {
      width: 8px; height: 8px; margin: 0 4px;
      background: #007AFF; border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }
    #loading span:nth-child(1) { animation-delay: -0.32s; }
    #loading span:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }
  </style>
  <script>
    function hideLoading() {
      var el = document.getElementById('loading');
      if (el) { el.style.opacity = '0'; setTimeout(function() { el.style.display = 'none'; }, 400); }
    }
    function pollForCanvas() {
      if (document.querySelector('flt-scene, canvas')) { hideLoading(); return; }
      var el = document.querySelector('[flt-renderer]');
      if (el) { setTimeout(hideLoading, 200); return; }
      setTimeout(pollForCanvas, 100);
    }
    pollForCanvas();
  </script>
</head>
<body>
  <div id="loading"><span></span><span></span><span></span></div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
